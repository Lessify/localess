# Localess with a separate Postgres. `docker compose up -d`, then open http://localhost:3000.
# For a single container with the embedded database instead, see docs/deployment/docker.md.
services:
  localess:
    build: .
    # image: ghcr.io/lessify/localess:latest
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://localess:localess@postgres:5432/localess
      # The public origin (behind a TLS proxy: https://cms.example.com). Used for OAuth callbacks and reset links.
      LOCALESS_PUBLIC_URL: http://localhost:3000
      # First boot only: creates this administrator while the database has no users. Remove afterwards.
      LOCALESS_ADMIN_EMAIL: admin@example.com
      LOCALESS_ADMIN_PASSWORD: change-me-now
      # Optional features — see server/README.md for every setting.
      # DEEPL_API_KEY: ...
      # UNSPLASH_API_KEY: ...
      # LOCALESS_SMTP_URL: smtps://user:password@smtp.example.com:465
    volumes:
      - localess-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: localess
      POSTGRES_PASSWORD: localess
      POSTGRES_DB: localess
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U localess -d localess']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  localess-data:
  postgres-data:
