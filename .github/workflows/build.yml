name: Build and Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned by `packageManager`; must run before setup-node so it can cache the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test --watch=false
      # Starts a throwaway embedded Postgres per run
      - run: pnpm shared:test
      - run: pnpm server:test
      - run: pnpm test:scripts

  build:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned by `packageManager`; must run before setup-node so it can cache the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # - run: pnpm prettier
      - run: pnpm build
      - run: pnpm server:build
