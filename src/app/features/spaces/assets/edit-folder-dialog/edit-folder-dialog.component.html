<hlm-dialog-header>
  <h2 hlmDialogTitle>Edit Folder</h2>
</hlm-dialog-header>
<form [formGroup]="form" class="flex flex-col gap-4">
  <div hlmField>
    <label hlmFieldLabel for="name">Name</label>
    <div hlmInputGroup>
      <input hlmInputGroupInput id="name" type="text" formControlName="name" maxlength="100" autocomplete="off" />
      <hlm-input-group-addon align="inline-end" class="text-muted-foreground text-xs">
        {{ form.controls['name'].value?.length || 0 }}/100
      </hlm-input-group-addon>
    </div>
    @if (form.controls['name'].errors; as errors) {
      <hlm-field-error>{{ fe.errors(errors) }}</hlm-field-error>
    }
  </div>
</form>
<hlm-dialog-footer>
  <button hlmBtn variant="outline" hlmDialogClose>Cancel</button>
  <button hlmBtn [disabled]="!form.valid" (click)="save()">
    <ng-icon hlm size="sm" name="lucideSave" />
    Save
  </button>
</hlm-dialog-footer>
