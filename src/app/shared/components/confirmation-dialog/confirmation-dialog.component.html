<hlm-dialog-header>
  <h2 hlmDialogTitle>{{ context.title }}</h2>
  <p hlmDialogDescription class="whitespace-pre-wrap">{{ context.content }}</p>
</hlm-dialog-header>
<hlm-dialog-footer>
  <button hlmBtn variant="outline" hlmDialogClose>Cancel</button>
  <button hlmBtn [variant]="okVariant" (click)="confirm()">OK</button>
</hlm-dialog-footer>
