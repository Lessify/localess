<hlm-dialog-header>
  <h2 hlmDialogTitle>Translate Locale</h2>
</hlm-dialog-header>
<form [formGroup]="form">
  <div hlmFieldGroup class="w-full">
    <div hlmField>
      <label hlmFieldLabel for="sourceLocale">Source Locale</label>
      <hlm-select id="sourceLocale" formControlName="sourceLocale" [itemToString]="localeItemToString">
        <hlm-select-trigger class="w-full">
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (locale of context.locales; track locale.id) {
            <hlm-select-item [value]="locale.id" [disabled]="!canTranslateFrom(locale)">{{ localeLabel(locale) }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>
    <div hlmField>
      <label hlmFieldLabel for="targetLocale">Target Locale</label>
      <hlm-select id="targetLocale" formControlName="targetLocale" [itemToString]="localeItemToString">
        <hlm-select-trigger class="w-full">
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (locale of context.locales; track locale.id) {
            <hlm-select-item [value]="locale.id" [disabled]="!canTranslateTo(locale)">{{ localeLabel(locale) }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>
    <div hlmField class="flex-row items-center gap-3">
      <hlm-checkbox inputId="overwrite" formControlName="overwrite" />
      <label hlmFieldLabel for="overwrite">Overwrite existing translations</label>
    </div>
  </div>
</form>
@if (context.description) {
  <p class="text-muted-foreground text-sm">{{ context.description }}</p>
}
<hlm-dialog-footer>
  <button hlmBtn variant="outline" hlmDialogClose>Cancel</button>
  <button
    hlmBtn
    [disabled]="!form.valid || form.value.sourceLocale === form.value.targetLocale || !isSelectionTranslatable()"
    (click)="save()">
    Translate
  </button>
</hlm-dialog-footer>
