<div class="flex items-start justify-between gap-3">
  <div class="flex min-w-0 flex-col">
    <span class="truncate font-semibold">{{ run().sourceSpaceName }}</span>
    <span class="text-muted-foreground truncate text-xs">from {{ host() }}</span>
  </div>
  <span hlmBadge [variant]="run().status === 'FAILED' ? 'destructive' : run().status === 'RUNNING' ? 'secondary' : 'outline'">{{
    statusText()
  }}</span>
</div>
