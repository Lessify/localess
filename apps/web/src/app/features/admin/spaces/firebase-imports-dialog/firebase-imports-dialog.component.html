<hlm-dialog-header>
  <h2 hlmDialogTitle>Imports from Firebase</h2>
</hlm-dialog-header>
@if (selectedRun(); as run) {
  <ll-firebase-import-run-header [run]="run" />
  <!-- The dialog box grows with its content and nothing scrolls it: long lists scroll on their own. -->
  <ll-firebase-import-progress class="block max-h-[50vh] overflow-y-auto" [run]="run" />
  <div class="flex justify-end gap-2">
    @if (run.status === 'RUNNING') {
      <button hlmBtn variant="outline" (click)="cancel(run)">Cancel import</button>
    }
    <button hlmBtn variant="outline" (click)="select(undefined)">Back</button>
  </div>
} @else {
  @if (runs().length) {
    <ul class="flex max-h-[60vh] flex-col gap-1 overflow-y-auto">
      @for (run of runs(); track run.id) {
        <li>
          <button hlmBtn variant="ghost" class="h-auto w-full justify-between py-2 text-left" (click)="select(run)">
            <span class="flex flex-col">
              <span class="font-medium">{{ run.sourceSpaceName }}</span>
              <span class="text-muted-foreground text-xs"
                >{{ run.origin }} · {{ run.startedBy.email }} · {{ run.startedAt | date: 'medium' }}</span
              >
            </span>
            <span hlmBadge [variant]="run.status === 'FAILED' ? 'destructive' : run.status === 'RUNNING' ? 'secondary' : 'outline'">{{
              statusLabel(run)
            }}</span>
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="text-muted-foreground text-sm">No imports yet.</p>
  }
}
