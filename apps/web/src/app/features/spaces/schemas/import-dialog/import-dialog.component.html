<hlm-dialog-header>
  <h2 hlmDialogTitle>Schema Import</h2>
</hlm-dialog-header>
<form [formGroup]="form" class="flex flex-col gap-4">
  <p class="text-muted-foreground text-sm"
    >Adds the schemas the space doesn't have and updates the others, matched by name; nothing is deleted.</p
  >
  <div class="flex flex-col gap-2">
    <button hlmBtn type="button" variant="outline" (click)="fileInput.click()">
      <ng-icon hlm size="sm" name="lucideUpload" />
      Upload File
    </button>
    @if (fileName) {
      <p class="text-muted-foreground text-sm">{{ fileName }}</p>
    }
    @if (fileWrong) {
      <p class="text-destructive text-sm">Expected a Localess file (*.localess.zip, or an older *.lls.zip).</p>
    }
  </div>
</form>
<hlm-dialog-footer>
  <button hlmBtn variant="outline" hlmDialogClose>Cancel</button>
  <button hlmBtn [disabled]="!form.valid" (click)="save()">
    <ng-icon hlm size="sm" name="lucideUploadCloud" />
    Import
  </button>
</hlm-dialog-footer>
<input hidden type="file" [accept]="fileAccept" #fileInput (change)="onFileChange($event)" />
