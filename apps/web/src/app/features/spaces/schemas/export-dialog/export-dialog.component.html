<hlm-dialog-header>
  <h2 hlmDialogTitle>Schema Export</h2>
</hlm-dialog-header>
<p class="py-2">Exports every schema as a Localess file, to import into another space (schemas are matched by name).</p>
<hlm-dialog-footer>
  <button hlmBtn variant="outline" hlmDialogClose>Cancel</button>
  <button hlmBtn (click)="save()">
    <ng-icon hlm size="sm" name="lucideCloudDownload" />
    Export
  </button>
</hlm-dialog-footer>
