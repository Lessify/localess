<hlm-dialog-header>
  <h2 hlmDialogTitle>Move</h2>
</hlm-dialog-header>
<form [formGroup]="form" class="flex flex-col gap-4">
  <div hlmField>
    <label hlmFieldLabel for="folder">Folder</label>
    <hlm-combobox
      id="folder"
      [(search)]="search"
      [filter]="noOpFilter"
      [value]="selected()"
      (valueChange)="choose($event)"
      [itemToString]="displayItem">
      <hlm-combobox-input placeholder="Search folders..." showClear />
      <hlm-combobox-content *hlmComboboxPortal>
        <hlm-combobox-empty>No results found.</hlm-combobox-empty>
        <div hlmComboboxList>
          @for (target of options(); track target.id) {
            <hlm-combobox-item [value]="target">
              <ng-icon hlm size="sm" [name]="target.id === null ? 'lucideHouse' : 'lucideFolder'" />
              {{ target.name }}
              <span class="text-muted-foreground text-xs">| {{ target.path || '~' }}</span>
            </hlm-combobox-item>
          }
        </div>
      </hlm-combobox-content>
    </hlm-combobox>
    @if (form.controls['target'].errors; as errors) {
      <hlm-field-error>{{ fe.errors(errors) }}</hlm-field-error>
    }
  </div>
</form>
<hlm-dialog-footer>
  <button hlmBtn variant="outline" hlmDialogClose>Cancel</button>
  <button hlmBtn [disabled]="!form.valid" (click)="save()">Move</button>
</hlm-dialog-footer>
