<hlm-dialog-header>
  <h2 hlmDialogTitle>Copy the signing secret</h2>
  <p hlmDialogDescription class="flex items-center gap-2">
    <ng-icon hlm size="sm" name="lucideTriangleAlert" />
    You won't see this secret again. Add it to your receiver now: it verifies each delivery with it (Standard Webhooks).
  </p>
</hlm-dialog-header>
<div hlmField>
  <span hlmFieldLabel>{{ context.name }}</span>
  <div class="flex items-center gap-2">
    <code class="bg-muted flex-1 rounded px-2 py-1 text-sm break-all" data-testid="webhook-secret">{{ context.secret }}</code>
    <button
      hlmBtn
      size="icon"
      variant="ghost"
      [cdkCopyToClipboard]="context.secret"
      (cdkCopyToClipboardCopied)="copied()"
      aria-label="Copy Secret">
      <ng-icon hlm size="sm" name="lucideCopy" />
    </button>
  </div>
</div>
<hlm-dialog-footer>
  <button hlmBtn hlmDialogClose>I've copied it</button>
</hlm-dialog-footer>
