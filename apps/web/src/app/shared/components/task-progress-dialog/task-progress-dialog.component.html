<hlm-dialog-header>
  <h2 hlmDialogTitle>{{ context.title }}</h2>
</hlm-dialog-header>
<div class="flex flex-col gap-3">
  <p data-testid="task-status" [class.text-destructive]="task().status === 'ERROR'">{{ statusText() }}</p>
  @if (!ended()) {
    <hlm-progress class="h-2" [value]="percent()" aria-label="Task progress">
      <hlm-progress-indicator />
    </hlm-progress>
  }
  @if (problems().length) {
    <ul class="text-muted-foreground max-h-48 list-disc overflow-auto pl-5 text-sm">
      @for (problem of problems(); track $index) {
        <li>{{ problem }}</li>
      }
    </ul>
  }
</div>
<hlm-dialog-footer>
  @if (ended()) {
    <button hlmBtn (click)="close()">Done</button>
  } @else {
    <button hlmBtn variant="outline" (click)="continueInBackground()">Continue in background</button>
  }
</hlm-dialog-footer>
