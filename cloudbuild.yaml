steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'enable-apis'
    entrypoint: 'bash'
    allowFailure: true
    args:
      - '-c'
      - |
        gcloud services enable \
          firebasestorage.googleapis.com \
          firebaseextensions.googleapis.com \
          cloudfunctions.googleapis.com \
          cloudbuild.googleapis.com \
          artifactregistry.googleapis.com \
          run.googleapis.com \
          eventarc.googleapis.com \
          pubsub.googleapis.com \
          storage.googleapis.com \
          translate.googleapis.com \
          cloudbilling.googleapis.com \
          --project=$PROJECT_ID
  - name: 'node:24'
    id: 'install-deps'
    entrypoint: npm
    args: [ 'install' ]
  - name: 'node:24'
    id: 'install-functions-deps'
    entrypoint: npm
    args: [ '--prefix', 'functions', 'install', '--platform=linuxmusl' ]
  - name: 'bash'
    id: 'generate-functions-env'
    args:
      - '-c'
      - |
        echo "REGION=${_REGION}" > functions/.env.$PROJECT_ID
  # firebase-config.json is tracked and holds the demo placeholder; the build swaps in this
  # file via the `deploy` configuration in angular.json, so nothing tracked is modified.
  - name: ghcr.io/lessify/firebase:edge
    id: 'Pull Firebase Apps SDK Config'
    args: [ 'apps:sdkconfig', '--project=$PROJECT_ID', 'web', '--out=src/environments/firebase-config.build.json' ]
  - name: 'node:24'
    id: 'version-generate'
    entrypoint: npm
    args:
      - 'run'
      - 'version:generate'
    env:
      - 'COMMIT_SHA=$COMMIT_SHA'
  - name: 'node:24'
    id: 'build-prod'
    entrypoint: npm
    args:
      - 'run'
      - 'build:deploy'
      - '--'
      - '--define'
      - 'LOCALESS_REGION="${_REGION}"'
      - '--define'
      - 'LOCALESS_AUTH_CUSTOM_DOMAIN="${_LOCALESS_AUTH_CUSTOM_DOMAIN}"'
      - '--define'
      - 'LOCALESS_AUTH_PROVIDERS="${_LOCALESS_AUTH_PROVIDERS}"'
      - '--define'
      - 'LOCALESS_LOGIN_MESSAGE="${_LOCALESS_LOGIN_MESSAGE}"'
      - '--define'
      - 'LOCALESS_UNSPLASH_ENABLE="${_LOCALESS_UNSPLASH_ENABLE}"'
  # apply the region to the /api/v1/** hosting rewrite without touching tracked firebase.json
  - name: 'node:24'
    id: 'generate-firebase-json'
    entrypoint: node
    args: [ 'scripts/generate-firebase-json.mjs', '$PROJECT_ID', '${_REGION}' ]
  # deploy to firebase
  - name: ghcr.io/lessify/firebase:edge
    id: 'firebase-deploy'
    args: [ 'deploy', '--config=firebase.$PROJECT_ID.json', '--project=$PROJECT_ID', '--only=hosting,functions,storage,firestore,auth', '--force' ]
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west6
